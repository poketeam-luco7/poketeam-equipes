name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    # Les tests tournent contre un vrai MongoDB ; le Pokédex est simulé dans les tests
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py test -v 2
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t poketeam-equipes .
